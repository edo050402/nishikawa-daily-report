{% extends 'base.html' %}{% block content %}<section class="card narrow"><h1>{{tr('account_edit')}}</h1><form method="post" class="form"><label>{{tr('employee_no')}}<input name="employee_no" value="{{u['employee_no'] or ''}}"></label><label>{{tr('name')}}<input name="name" value="{{u['name']}}" required></label><label>{{tr('username')}}<input name="username" value="{{u['username']}}" required></label><label>{{tr('role')}}<select name="role"><option value="employee" {% if u['role']=='employee' %}selected{% endif %}>{{tr('employee')}}</option><option value="admin" {% if u['role']=='admin' %}selected{% endif %}>{{tr('admin')}}</option></select></label><label>{{tr('new_password')}}<input type="password" name="password" minlength="8"></label><div class="formbuttons"><a class="secondary button" href="{{url_for('users')}}">{{tr('back')}}</a><button class="primary">{{tr('save')}}</button></div></form></section>{% endblock %}
