{% extends 'base.html' %}{% block content %}
<section class="card"><div class="sectiontitle"><div><h1>{% if report %}{{tr('report_edit')}}{% else %}{{tr('report_input')}}{% endif %}</h1><p class="muted">{{tr('report_help')}}</p></div><span>{{tr('quarter')}}</span></div>
<form method="post" class="form" id="dayForm">
<div class="grid3 attendance"><label>{{tr('date')}}<input type="date" lang="ja" name="work_date" value="{{report['work_date'] if report else today}}" required></label><label>{{tr('start_work')}}<input type="time" step="900" name="attendance_start" value="{{report['attendance_start'] if report else '08:30'}}" required></label><label>{{tr('end_work')}}<input type="time" step="900" name="attendance_end" value="{{report['attendance_end'] if report else '17:30'}}" required></label></div>
<div class="workhead"><h2>{{tr('work_details')}}</h2><button type="button" class="secondary" onclick="addRow()">{{tr('add_work')}}</button></div>
<div id="rows" class="workrows"></div>
<label>{{tr('remarks')}}<textarea name="remarks" rows="3">{{report['remarks'] if report else ''}}</textarea></label>
<div class="formbuttons"><a class="secondary button" href="{{url_for('dashboard')}}">{{tr('back')}}</a><button class="primary">{{tr('save')}}</button></div></form></section>
<template id="rowTemplate"><div class="workrow"><div class="rowtop"><b class="rownum">1</b><button type="button" class="remove" onclick="removeRow(this)">{{tr('delete')}}</button></div><div class="grid2"><label>{{tr('job_no')}}<select name="job_id[]" class="jobSelect" onchange="fillJob(this)"><option value="">{{tr('no_job')}}</option>{% for j in jobs %}<option value="{{j['id']}}" data-content="{{j['default_content'] or ''}}">{{j['job_no']}}{% if j['project_name'] %} — {{j['project_name']}}{% endif %}</option>{% endfor %}</select></label><label>{{tr('work_code')}}<select name="work_code[]"><option value="">{{tr('no_select')}}</option>{% for k,v in work_codes.items() %}<option value="{{k}}">{{k}} — {{v}}</option>{% endfor %}</select></label></div><div class="grid2"><label>{{tr('content')}}<input name="content[]" class="contentInput" required placeholder="{{ 'Contoh: Desain software' if ui_lang=='id' else '例: ソフト設計' }}"></label><label>{{tr('place')}}<select name="location[]" class="locationInput"><option value="">{{tr('choose')}}</option><option value="社内">{{tr('office')}}</option><option value="現場">{{tr('site')}}</option></select></label></div><div class="grid2"><label>{{tr('start')}}<input type="time" step="900" name="start_time[]"></label><label>{{tr('end')}}<input type="time" step="900" name="end_time[]"></label></div><div class="entryAdjust"><div class="adjustTitle"><b>{{tr('time_class')}}</b><button type="button" class="secondary addAdjBtn" onclick="addAdjustToRow(this)">{{tr('add_class')}}</button></div><p class="muted smallnote">{{tr('class_help')}}</p><div class="entryAdjustRows"></div></div></div></template>
<template id="adjustTemplate"><div class="adjustrow"><input type="hidden" name="adjust_entry_order[]" class="adjustEntryOrder" value="0"><label>{{tr('classification')}}<select name="adjust_type[]"><option value="-">－</option><option value="残">残</option><option value="み">み</option><option value="早">早</option><option value="F">F</option><option value="深">深</option></select></label><label>{{tr('hours')}}<input name="adjust_hours[]" type="number" min="0" step="0.25" placeholder="{{ 'Contoh: 1.00' if ui_lang=='id' else '例: 1.00' }}"></label><button type="button" class="remove" onclick="removeAdjust(this)">{{tr('delete')}}</button></div></template>
<script>
const initialEntries=[{% for e in entries %}{job_id:"{{e['job_id'] or ''}}",work_code:"{{e['work_code']}}",content:{{e['content']|tojson}},location:{{e['location']|tojson}},start:"{{e['start_time'] or ''}}",end:"{{e['end_time'] or ''}}"}{% if not loop.last %},{% endif %}{% endfor %}];
const initialAdjust=[{% for a in adjustments %}{entry_order:{{a['work_entry_order'] if 'work_entry_order' in a.keys() else 0}},type:{{a['category']|tojson}},hours:"{{'%.2f'|format(a['hours'])}}"}{% if not loop.last %},{% endif %}{% endfor %}];
function renumber(){document.querySelectorAll('.workrow').forEach((r,i)=>{r.querySelector('.rownum').textContent=i+1;r.dataset.order=i;r.querySelectorAll('.adjustEntryOrder').forEach(x=>x.value=i)})}
function addRow(data={}){const t=document.getElementById('rowTemplate').content.cloneNode(true);const row=t.querySelector('.workrow');row.querySelector('[name="job_id[]"]').value=data.job_id||'';row.querySelector('[name="work_code[]"]').value=data.work_code||'';row.querySelector('[name="content[]"]').value=data.content||'';row.querySelector('[name="location[]"]').value=data.location||'';row.querySelector('[name="start_time[]"]').value=data.start||'';row.querySelector('[name="end_time[]"]').value=data.end||'';document.getElementById('rows').appendChild(t);renumber();return document.querySelector('#rows .workrow:last-child')}
function removeRow(btn){if(document.querySelectorAll('.workrow').length<=1){alert({{ ('"Masukkan minimal 1 pekerjaan."' if ui_lang=='id' else '"作業を1件以上入力してください。"')|safe }});return}btn.closest('.workrow').remove();renumber()}
function fillJob(sel){const o=sel.options[sel.selectedIndex];const content=sel.closest('.workrow').querySelector('.contentInput');if(o&&o.dataset.content&&!content.value)content.value=o.dataset.content}
function addAdjust(row,data={}){const box=row.querySelector('.entryAdjustRows');if(box.querySelectorAll('.adjustrow').length>=2){alert({{ ('"Maksimal 2 kategori waktu per pekerjaan untuk Excel."' if ui_lang=='id' else '"Excelの1作業欄に入力できる時間区分は2件までです。"')|safe }});return}const t=document.getElementById('adjustTemplate').content.cloneNode(true);const a=t.querySelector('.adjustrow');a.querySelector('[name="adjust_type[]"]').value=data.type||'-';a.querySelector('[name="adjust_hours[]"]').value=data.hours||'';a.querySelector('.adjustEntryOrder').value=row.dataset.order||0;box.appendChild(t)}
function addAdjustToRow(btn){addAdjust(btn.closest('.workrow'))}
function removeAdjust(btn){const row=btn.closest('.workrow');const box=row.querySelector('.entryAdjustRows');if(box.querySelectorAll('.adjustrow').length<=1){box.querySelector('[name="adjust_type[]"]').value='-';box.querySelector('[name="adjust_hours[]"]').value='';return}btn.closest('.adjustrow').remove()}
if(initialEntries.length){initialEntries.forEach(addRow)}else{addRow()}
document.querySelectorAll('.workrow').forEach(r=>addAdjust(r));
if(initialAdjust.length){document.querySelectorAll('.workrow').forEach(r=>r.querySelector('.entryAdjustRows').innerHTML='');initialAdjust.forEach(a=>{const rows=document.querySelectorAll('.workrow');if(rows[a.entry_order])addAdjust(rows[a.entry_order],a)});document.querySelectorAll('.workrow').forEach(r=>{if(!r.querySelector('.adjustrow'))addAdjust(r)})}
renumber();
</script>{% endblock %}
