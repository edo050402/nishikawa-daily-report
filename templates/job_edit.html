{% extends 'base.html' %}{% block content %}<section class="card narrow"><h1>{{tr('job_edit')}}</h1><form method="post" class="form"><label>{{tr('job_no')}}<input name="job_no" value="{{j['job_no']}}" required></label><label>{{tr('project')}}<input name="project_name" value="{{j['project_name'] or ''}}"></label><label>{{tr('client')}}<input name="client_name" value="{{j['client_name'] or ''}}"></label><label>{{tr('default_content')}}<input name="default_content" value="{{j['default_content'] or ''}}"></label><label>{{tr('status')}}<select name="active"><option value="1" {% if j['active'] %}selected{% endif %}>{{tr('active')}}</option><option value="0" {% if not j['active'] %}selected{% endif %}>{{tr('inactive')}}</option></select></label><div class="formbuttons"><a class="secondary button" href="{{url_for('jobs')}}">{{tr('back')}}</a><button class="primary">{{tr('save')}}</button></div></form></section>{% endblock %}
